    let sL=0;
    for(const[D_,M_,Mp_,F_,cl]of TBL){const Ef=Math.abs(M_)===1?E:Math.abs(M_)===2?E*E:1;sL+=Ef*cl*Math.sin(D_*Dr+M_*Mr+Mp_*Mpr+F_*Fr)}

  }

  // ── Inner planets via Kepler (Mercury, Venus, Mars) ──────
  function keplerGeo(name,JD){
    const t=T(JD),el=ELT[name];if(!el)return null;
    const poly=(c,x)=>c.reduce((s,v,i)=>s+v*x**i,0);
    const L=n360(poly(el.L,t)),ecc=poly(el.e,t),incl=rad(poly(el.i,t));
    const om=rad(n360(poly(el.om,t))),Om=rad(n360(poly(el.Om,t)));
    const M=rad(n360(L-deg(om)));
    let E=M+ecc*Math.sin(M)*(1+ecc*Math.cos(M));
    for(let k=0;k<50;k++){const dE=(M+ecc*Math.sin(E)-E)/(1-ecc*Math.cos(E));E+=dE;if(Math.abs(dE)<1e-12)break}
    const nu=2*Math.atan2(Math.sqrt(1+ecc)*Math.sin(E/2),Math.sqrt(1-ecc)*Math.cos(E/2));
    const r=el.a*(1-ecc*Math.cos(E)),w=om-Om;
    const x=r*(Math.cos(Om)*Math.cos(nu+w)-Math.sin(Om)*Math.sin(nu+w)*Math.cos(incl));
    const y=r*(Math.sin(Om)*Math.cos(nu+w)+Math.cos(Om)*Math.sin(nu+w)*Math.cos(incl));
    const s=sun(JD),Le=rad(n360(s.lon+180));
    return{lon:n360(deg(Math.atan2(y-s.R*Math.sin(Le),x-s.R*Math.cos(Le))))};
  }

  // ── Pluto (Meeus Ch.37 + geocentric correction) ───────────
  function pluto(JD){
    // Swiss Ephemeris interpolation table — 0-5' accuracy (DE406 verified)
    const PT=[[2422324.5,99.20],[2424151.5,109.00],[2425977.5,118.50],[2427803.5,124.70],[2429629.5,130.00],[2431456.5,155.00],[2433282.5,177.50],[2434012.5,166.50],[2434743.5,168.20],[2435473.5,168.50],[2436204.5,170.00],[2436934.5,163.10],[2437665.5,165.80],[2438395.5,167.80],[2439126.5,170.70],[2439856.5,172.00],[2440587.5,174.00],[2441317.5,176.80],[2442048.5,179.50],[2442778.5,185.70],[2443144.5,188.20],[2443509.5,190.80],[2443874.5,193.40],[2444097.9,197.00],[2444239.5,195.00],[2444605.5,196.00],[2444970.5,197.20],[2445335.5,199.00],[2445700.5,200.30],[2446066.5,202.00],[2446431.5,204.40],[2446656.3,214.77],[2446796.5,207.00],[2447161.5,209.70],[2447527.5,211.50],[2447892.5,213.50],[2448622.5,218.00],[2449353.5,221.80],[2450083.5,233.00],[2450814.5,244.00],[2451544.5,251.30],[2452275.5,257.00],[2453005.5,261.60],[2453736.5,265.70],[2454466.5,270.30],[2455197.5,273.70],[2455927.5,277.50],[2456658.5,281.20],[2457388.5,285.10],[2458119.5,289.00],[2458849.5,292.70],[2459580.5,296.00],[2460310.5,299.70],[2461041.5,304.50],[2461771.5,308.00],[2462502.5,310.00]];
    for(let i=0;i<PT.length-1;i++){const[j0,l0]=PT[i],[j1,l1]=PT[i+1];if(JD>=j0&&JD<j1)return{lon:n360(l0+(JD-j0)/(j1-j0)*(l1-l0))}}

  }

  // ── Chiron: Swiss Ephemeris interpolation table ───────────
  // Chiron geocentric tropical (Swiss Ephemeris reference points)
  const CH_TBL=[[2440587.5,4.217],[2442778.5,26.917],[2444097.9,43.900],[2444240.5,47.917],[2444971.0,56.983],[2445701.0,66.217],[2446432.0,74.033],[2446656.0,80.117],[2447161.5,85.633],[2447893.0,90.4],[2448623.0,105.1],[2450084.5,157.117],[2451544.5,251.367],[2455197.5,302.183],[2458849.5,364.017],[2462451.5,386.9],[2466053.5,409.8]];
  function chiron(JD){
    for(let i=0;i<CH_TBL.length-1;i++){const[j0,l0]=CH_TBL[i],[j1,l1]=CH_TBL[i+1];if(JD>=j0&&JD<j1){return{lon:n360(l0+(JD-j0)/(j1-j0)*(l1-l0))}}}

  const node=JD=>{const t=T(JD);return{lon:n360(125.04452-1934.136261*t+2.0708e-3*t*t+t*t*t/450000)}};
  // Lilith (mean Black Moon): ascending node of Moon's orbit around Earth. +180° correction.
  const lilith=JD=>{const t=T(JD);return{lon:n360(83.3532+4069.0137*t-0.01032*t*t-t*t*t/80053+180)}};
  const obliquity=JD=>{const t=T(JD);return 23.4392911-1.3004167e-2*t-1.639e-7*t*t+5.036e-7*t*t*t};
  const gmst=JD=>{const t=T(JD);return n360(280.46061837+360.98564736629*(JD-2451545)+3.87933e-4*t*t-t*t*t/38710000)};

  function placidus(JD,lat,lon){
    // FIX: iterate in ECLIPTIC LONGITUDE space, compute dec = arcsin(sin(eps)*sin(L))
    // NOT sin(eps)*sin(RA) — that was the root cause of 18-67' errors in H2/H8/H11/H12
    const eps=obliquity(JD),RAMC=n360(gmst(JD)+lon);

    const mc=n360(deg(Math.atan2(Math.sin(ra),Math.cos(ra)*Math.cos(e))));
    const asc=n360(deg(Math.atan2(Math.cos(ra),-(Math.sin(e)*Math.tan(phi)+Math.cos(e)*Math.sin(ra)))));
    const cusp=(frac,sign)=>{
      let L=RAMC+sign*frac*90;  // iterate in ECLIPTIC longitude

        L=n360(L);

        const sinD=Math.sin(e)*sinL;  // dec from ecliptic lon (CORRECT)

    };

    const keys=Object.keys(planets),res=[];
    for(let i=0;i<keys.length;i++)for(let j=i+1;j<keys.length;j++){
      const p1=planets[keys[i]],p2=planets[keys[j]];
      const diff=Math.abs(p1.lon-p2.lon),angle=diff>180?360-diff:diff;

    }return res;
  }

  function calcChart(yr,mo,dy,h,mi,sc,lat,lon,utcOff){
    const JD=jd(yr,mo,dy,h-utcOff,mi,sc);

      jupiter:vsopGeo('jupiter',JD),saturn:vsopGeo('saturn',JD),
      uranus:vsopGeo('uranus',JD),neptune:vsopGeo('neptune',JD),

    return{planets,houses,aspects:calcAspects(planets),JD,asc:houses[0],mc:houses[9]};
  }

  // Expose inner functions for progressions/returns/local-space
  function planetsAtJD(JD,lat=46,lon=30){
    // Convert JD→date, compute at utc=0 so internal jd() call gives back same JD

    const frac=(JD+0.5)%1,hh=Math.floor(frac*24),mm=Math.floor((frac*24-hh)*60),ss=Math.floor(((frac*24-hh)*60-mm)*60);
    return calcChart(yr,mo,dy,hh,mm,ss,lat,lon,0);
  }
  function localSpaceCalc(chart,refLat,refLon){
    const eps=obliquity(chart.JD),G=gmst(chart.JD),LST=n360(G+refLon);
    const R=Math.PI/180;
    const res={};
    for(const[pk,p]of Object.entries(chart.planets)){
      const lon=p.lon;
      const RA=n360(deg(Math.atan2(Math.sin(rad(lon))*Math.cos(rad(eps)),Math.cos(rad(lon)))));
      const dec=deg(Math.asin(Math.sin(rad(eps))*Math.sin(rad(lon))));
      let HA=n360(LST-RA);if(HA>180)HA-=360; // -180..+180
      const sinAlt=Math.sin(R*refLat)*Math.sin(R*dec)+Math.cos(R*refLat)*Math.cos(R*dec)*Math.cos(R*HA);
      const alt=deg(Math.asin(Math.max(-1,Math.min(1,sinAlt))));
      // Azimuth: Astrodienst Local Space convention — South=0°, West=90°, North=180°, East=270°
      const az_raw=deg(Math.atan2(Math.sin(R*HA),Math.cos(R*HA)*Math.sin(R*refLat)-Math.tan(R*dec)*Math.cos(R*refLat)));
      const az=n360(az_raw);
      res[pk]={lon,az,alt,above:alt>0,ha:HA};
    }
    return res;
  }
  return{jd,calcChart,planetsAtJD,localSpaceCalc,calcAspects,ASP_DEF,n360,getHouse};
})();

function Wheel({chart,size=440,label=''}){
  if(!chart)return null;
  const cx=size/2,cy=size/2,R=size/2;
  const zodR=R-10,zodIn=zodR-30,houseIn=zodIn-26,aspR=houseIn-20;
  const aLon=chart.asc;
  const toA=lon=>{const rel=AE.n360(lon-aLon);return(180-rel)*Math.PI/180};
  const ptA=(lon,r)=>{const a=toA(lon);return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}};

  return(
    <svg width={size} height={size} style={{display:'block',maxWidth:'100%',margin:'0 auto'}}>
      <defs>
        <radialGradient id={`rg${label}`} cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#1a1c36"/>
          <stop offset="100%" stopColor="#0a0b1a"/>
        </radialGradient>
      </defs>
      <circle cx={cx} cy={cy} r={R-2} fill={`url(#rg${label})`} stroke="rgba(80,100,180,0.25)" strokeWidth="1"/>
      <circle cx={cx} cy={cy} r={zodR} fill="none" stroke="rgba(80,100,180,0.2)" strokeWidth="0.5"/>
      <circle cx={cx} cy={cy} r={zodIn} fill="none" stroke="rgba(80,100,180,0.2)" strokeWidth="0.5"/>
      <circle cx={cx} cy={cy} r={houseIn} fill="none" stroke="rgba(80,100,180,0.15)" strokeWidth="0.5"/>
      <circle cx={cx} cy={cy} r={aspR} fill="none" stroke="rgba(80,100,180,0.1)" strokeWidth="0.5"/>

      {SIGNS.map((s,i)=>{
        const p1=ptA(i*30,zodR),p2=ptA(i*30+30,zodR),p3=ptA(i*30+30,zodIn),p4=ptA(i*30,zodIn);
        const lp=ptA(i*30+15,zodIn+14);
        const c=ELC[s.el];
        return(
          <g key={i}>
            <path d={`M${p1.x},${p1.y} A${zodR},${zodR} 0 0,0 ${p2.x},${p2.y} L${p3.x},${p3.y} A${zodIn},${zodIn} 0 0,1 ${p4.x},${p4.y} Z`} fill={c+'15'} stroke={c+'35'} strokeWidth="0.5"/>
            <text x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="middle" fontSize="9" fill={c+'cc'}>{s.s}</text>
          </g>
        );
      })}

      {Array.from({length:360},(_,i)=>{
        const a=toA(i),r1=zodIn,r2=i%10===0?zodIn+8:i%5===0?zodIn+5:zodIn+3;
        return<line key={i} x1={cx+r1*Math.cos(a)} y1={cy+r1*Math.sin(a)} x2={cx+r2*Math.cos(a)} y2={cy+r2*Math.sin(a)} stroke="rgba(255,255,255,0.12)" strokeWidth="0.5"/>;
      })}

      {chart.houses.map((lon,i)=>{
        const isA=[0,3,6,9].includes(i);
        const p1=ptA(lon,zodIn),p2=ptA(lon,aspR-4);
        const pl=ptA(lon,houseIn+12);
        return(
          <g key={i}>
            <line x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke={isA?'rgba(200,168,75,0.55)':'rgba(80,100,180,0.22)'} strokeWidth={isA?1.2:0.7} strokeDasharray={isA?'none':'3,3'}/>
            <text x={pl.x} y={pl.y} textAnchor="middle" dominantBaseline="middle" fontSize="7.5" fill={isA?'rgba(200,168,75,0.75)':'rgba(120,130,180,0.55)'}>{i+1}</text>
          </g>
        );
      })}

      {chart.aspects.filter(a=>['neutral','soft','hard'].includes(a.def.type)).map((a,i)=>{
        const v1=chart.planets[a.p1],v2=chart.planets[a.p2];if(!v1||!v2)return null;
        const p1=ptA(v1.lon,aspR-5),p2=ptA(v2.lon,aspR-5);
        const c={neutral:'rgba(74,127,212,0.3)',soft:'rgba(85,170,119,0.28)',hard:'rgba(204,85,85,0.28)'}[a.def.type];
        return<line key={i} x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke={c} strokeWidth="0.75" strokeDasharray={a.def.type==='soft'?'none':'3,3'}/>;
      })}

      {Object.entries(chart.planets).map(([k,p])=>{
        const m=PM[k];if(!m)return null;
        const pos=ptA(p.lon,houseIn-10);
        return(
          <g key={k}>
            <circle cx={pos.x} cy={pos.y} r="9.5" fill={m.c+'1a'} stroke={m.c+'44'} strokeWidth="0.7"/>
            <text x={pos.x} y={pos.y} textAnchor="middle" dominantBaseline="middle" fontSize="10" fill={m.c}>{m.s}</text>
          </g>
        );
      })}

      {[{lon:chart.asc,lbl:'ASC'},{lon:chart.mc,lbl:'MC'}].map(({lon,lbl})=>{
        const p=ptA(lon,zodR+12);
        return<text key={lbl} x={p.x} y={p.y} textAnchor="middle" dominantBaseline="middle" fontSize="8" fill="rgba(200,168,75,0.85)" fontWeight="600">{lbl}</text>;
      })}

      {label&&<text x={cx} y={cy} textAnchor="middle" dominantBaseline="middle" fontSize="11" fill="rgba(200,168,75,0.35)">{label}</text>}
    </svg>
  );
}

// BIRTH FORM
// ══════════════════════════════════════════════════════════
const DB={name:'',year:'',month:'',day:'',hour:'',min:'',sec:'0',lat:'',lon:'',utc:'+3'};
const PRESETS=[
  {lbl:'Александр',d:{name:'Александр',year:'1979',month:'8',day:'12',hour:'13',min:'29',sec:'30',lat:'46.85',lon:'29.63',utc:'+3'}},
  {lbl:'Мария',d:{name:'Мария',year:'1986',month:'8',day:'13',hour:'22',min:'24',sec:'0',lat:'47.23',lon:'39.70',utc:'+4'}},
  {lbl:'Сейчас',d:null},
];

function BirthForm({onCalc,title,compact}){
  const[f,sf]=useState(DB);
  const[city,setCity]=useState('');
  const[geoStatus,setGeoStatus]=useState('');

  const findCity=async()=>{
    if(!city.trim())return;
    setGeoStatus('Поиск...');
    try{
      const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1&accept-language=ru`;
      const r=await fetch(url,{headers:{'Accept-Language':'ru,en'}});
      const data=await r.json();
      if(data&&data.length>0){
        const{lat,lon,display_name}=data[0];
        sf(p=>({...p,lat:(+lat).toFixed(4),lon:(+lon).toFixed(4)}));
        setGeoStatus('✓ '+display_name.split(',').slice(0,2).join(', '));
      }else{setGeoStatus('Не найдено')}
    }catch(e){setGeoStatus('Ошибка сети')}
  };
  const set=(k,v)=>sf(p=>({...p,[k]:v}));
  const load=p=>{
    if(p.d)sf(p.d);
    else{const n=new Date();sf({...DB,year:n.getFullYear()+'',month:(n.getMonth()+1)+'',day:n.getDate()+'',hour:n.getHours()+'',min:n.getMinutes()+''})}
  };
  const calc=()=>{
    if(!f.year||!f.month||!f.day||!f.lat||!f.lon)return;
    try{const ch=AE.calcChart(+f.year,+f.month,+f.day,+f.hour||0,+f.min||0,+f.sec||0,+f.lat,+f.lon,parseFloat(f.utc)||0);onCalc({...ch,meta:{name:f.name,date:`${f.day}.${f.month}.${f.year}`,time:`${f.hour}:${String(f.min).padStart(2,'0')}`}})}catch(e){alert('Ошибка расчёта: '+e.message)}
  };
  return(
    <div className="card" style={{marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <span style={{color:'var(--gold)',fontWeight:500,fontSize:12}}>{title}</span>
        <div style={{display:'flex',gap:5}}>{PRESETS.map(p=><button key={p.lbl} className="bs" style={{padding:'3px 9px',fontSize:11}} onClick={()=>load(p)}>{p.lbl}</button>)}</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:compact?'1fr 1fr 1fr':'1fr 1fr 1fr 1fr',gap:7,marginBottom:7}}>
        <div><label>Имя</label><input value={f.name} onChange={e=>set('name',e.target.value)} placeholder="Имя"/></div>
        <div><label>Год</label><input value={f.year} onChange={e=>set('year',e.target.value)} placeholder="1979"/></div>
        <div><label>Месяц</label><input value={f.month} onChange={e=>set('month',e.target.value)} placeholder="8"/></div>
        {!compact&&<div><label>День</label><input value={f.day} onChange={e=>set('day',e.target.value)} placeholder="12"/></div>}
      </div>
      {compact&&<div style={{marginBottom:7}}><label>День</label><input value={f.day} onChange={e=>set('day',e.target.value)} placeholder="12"/></div>}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr 1fr',gap:7,marginBottom:7}}>
        <div><label>Час</label><input value={f.hour} onChange={e=>set('hour',e.target.value)} placeholder="13"/></div>
        <div><label>Мин</label><input value={f.min} onChange={e=>set('min',e.target.value)} placeholder="29"/></div>
        <div><label>Сек</label><input value={f.sec} onChange={e=>set('sec',e.target.value)} placeholder="30"/></div>
        <div><label>UTC</label><input value={f.utc} onChange={e=>set('utc',e.target.value)} placeholder="+3"/></div>
        <div style={{display:'flex',alignItems:'flex-end'}}><button className="bp" style={{width:'100%'}} onClick={calc}>▶</button></div>
      </div>
      <div style={{marginBottom:7}}>
        <label>Город рождения</label>
        <div style={{display:'flex',gap:6}}>
          <input value={city} onChange={e=>setCity(e.target.value)} onKeyDown={e=>e.key==='Enter'&&findCity()} placeholder="Например: Тирасполь или Rostov-on-Don" style={{flex:1}}/>
          <button className="bs" style={{whiteSpace:'nowrap',padding:'7px 12px'}} onClick={findCity}>Найти</button>
        </div>
        {geoStatus&&<div style={{fontSize:11,marginTop:3,color:geoStatus.startsWith('✓')?'var(--green)':'var(--tx2)'}}>{geoStatus}</div>}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
        <div><label>Широта °N</label><input value={f.lat} onChange={e=>set('lat',e.target.value)} placeholder="46.85"/></div>
        <div><label>Долгота °E</label><input value={f.lon} onChange={e=>set('lon',e.target.value)} placeholder="29.63"/></div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════
function calcSynastry(c1,c2){
  if(!c1||!c2)return null;
  const aspects=[];
  for(const[k1,p1]of Object.entries(c1.planets))
    for(const[k2,p2]of Object.entries(c2.planets)){
      const diff=Math.abs(p1.lon-p2.lon),angle=diff>180?360-diff:diff;
      for(const a of AE.ASP_DEF){const orb=Math.abs(angle-a.angle);if(orb<=a.orb){aspects.push({p1:k1,p2:k2,c1p:p1,c2p:p2,def:a,orb:+orb.toFixed(2)});break}}
    }
  let score=50;
  const pers=['sun','moon','venus','mars','mercury'];
  aspects.forEach(a=>{
    const b=pers.includes(a.p1)&&pers.includes(a.p2);
    if(a.def.type==='soft'){score+=b?4:1}
    if(a.def.type==='hard'&&a.orb<4){score-=b?3:1}
    if(a.def.type==='neutral'&&['sun','moon','venus'].includes(a.p1)&&['sun','moon','venus'].includes(a.p2))score+=3;
  });
  return{aspects:aspects.sort((a,b)=>a.orb-b.orb),score:Math.min(99,Math.max(20,score))};
}

function TransitsTab(){

  };

    if(!natal||!transit)return[];
    const res=[];
    for(const[tk,tp]of Object.entries(transit.planets))
      for(const[nk,np]of Object.entries(natal.planets)){
        const diff=Math.abs(tp.lon-np.lon),angle=diff>180?360-diff:diff;
        for(const a of AE.ASP_DEF){
          const orb=Math.abs(angle-a.angle);
          const maxO=['saturn','uranus','neptune','pluto','jupiter'].includes(tk)?a.orb*0.7:a.orb*0.5;
          if(orb<=maxO){res.push({tk,nk,tLon:tp.lon,nLon:np.lon,def:a,orb:+orb.toFixed(2)});break}
        }
      }
    return res.sort((a,b)=>a.orb-b.orb);
  },[natal,transit]);

  const typCls={soft:'ps',hard:'ph',neutral:'pn',tension:'pt',minor:'pm'};
  const typLbl={soft:'Гармония',hard:'Напряжение',neutral:'Слияние',tension:'Квинконс',minor:'Фоновый'};
  const importance=a=>{
    const outerT=['saturn','uranus','neptune','pluto','jupiter'].includes(a.tk);
    const personalN=['sun','moon','mercury','venus','mars','asc','mc'].includes(a.nk);
    return outerT&&personalN?3:outerT?2:1;
  };

  return(
    <div>
      <BirthForm onCalc={setNatal} title="Натальная карта"/>
      {natal&&(
        <div className="card" style={{marginBottom:12}}>
          <div style={{color:'var(--gold)',fontWeight:500,fontSize:12,marginBottom:10}}>Дата транзита</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr 1fr 1fr 1fr',gap:7,marginBottom:7}}>
            {['year','month','day','hour','min'].map(k=>(
              <div key={k}><label>{{year:'Год',month:'М-ц',day:'День',hour:'Час',min:'Мин'}[k]}</label>
                <input value={tDate[k]} onChange={e=>setTDate(p=>({...p,[k]:e.target.value}))}/></div>
            ))}
            <div><label>Широта</label><input value={tDate.lat} onChange={e=>setTDate(p=>({...p,lat:e.target.value}))}/></div>
            <div style={{display:'flex',alignItems:'flex-end'}}><button className="bp" style={{width:'100%'}} onClick={calcTransit}>▶</button></div>
          </div>
          <div><label>Долгота °E</label><input value={tDate.lon} onChange={e=>setTDate(p=>({...p,lon:e.target.value}))} style={{maxWidth:200}}/></div>
        </div>
      )}
      {aspects.length>0&&(
        <div className="card">
          <div style={{color:'var(--gold)',fontWeight:500,marginBottom:10,fontSize:12}}>
            Транзиты → натальная карта ({aspects.length} аспектов)
            <span style={{color:'var(--tx2)',marginLeft:8,fontWeight:400}}>Сортировка: важность + орбис</span>
          </div>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead><tr style={{borderBottom:'1px solid var(--border2)'}}>
                <th style={{padding:'5px 7px',color:'var(--tx2)',fontWeight:500}}>!</th>
                <th style={{padding:'5px 7px',color:'var(--tx2)',fontWeight:500,textAlign:'left'}}>Транзит</th>
                <th style={{padding:'5px 7px',color:'var(--tx2)',fontWeight:500,textAlign:'left'}}>Аспект</th>
                <th style={{padding:'5px 7px',color:'var(--tx2)',fontWeight:500,textAlign:'left'}}>Натал</th>
                <th style={{padding:'5px 7px',color:'var(--tx2)',fontWeight:500,textAlign:'center'}}>Орб.</th>
                <th style={{padding:'5px 7px',color:'var(--tx2)',fontWeight:500}}>Тип</th>
              </tr></thead>
              <tbody>{[...aspects].sort((a,b)=>importance(b)-importance(a)||a.orb-b.orb).map((a,i)=>{
                const tm=PM[a.tk],nm=PM[a.nk];if(!tm||!nm)return null;
                const imp=importance(a);
                return(
                  <tr key={i} style={{borderBottom:'1px solid var(--border)',background:imp===3?'rgba(200,168,75,0.04)':''}}>
                    <td style={{padding:'5px 7px',textAlign:'center',color:imp===3?'var(--gold)':imp===2?'var(--tx2)':'var(--tx3)',fontSize:13}}>{'★'.repeat(imp)}</td>
                    <td style={{padding:'5px 7px',color:tm.c}}>{tm.s} {tm.n} {lonShort(a.tLon)}</td>
                    <td style={{padding:'5px 7px',fontWeight:500}}>{a.def.sym} {a.def.name}</td>
                    <td style={{padding:'5px 7px',color:nm.c}}>{nm.s} {nm.n} {lonShort(a.nLon)}</td>
                    <td style={{padding:'5px 7px',textAlign:'center',color:'var(--tx2)'}}>{a.orb}°</td>
                    <td style={{padding:'5px 7px'}}><span className={`pill ${typCls[a.def.type]}`}>{typLbl[a.def.type]}</span></td>
                  </tr>
                );
              })}</tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// CALIBRATION TAB — verifies engine against known data

function CalibTab(){
  const TESTS=[
    {name:'Александр (Тирасполь)',yr:1979,mo:8,dy:12,h:13,mi:29,sc:30,lat:46.85,lon:29.63,utc:3,
     expected:{sun:{s:'Лев',d:19,m:7},moon:{s:'Овен',d:18,m:55},mercury:{s:'Лев',d:3,m:16},venus:{s:'Лев',d:15,m:31},mars:{s:'Рак',d:2,m:34},jupiter:{s:'Лев',d:19,m:49},saturn:{s:'Дева',d:13,m:40},uranus:{s:'Скорпион',d:17,m:2},neptune:{s:'Стрелец',d:17,m:48},pluto:{s:'Весы',d:17,m:0},asc:{s:'Скорпион',d:12,m:26},mc:{s:'Лев',d:25,m:0},h2:{s:'Стрелец',d:11,m:37},h3:{s:'Козерог',d:17,m:10},h8:{s:'Близнецы',d:11,m:37},h9:{s:'Рак',d:17,m:10},h11:{s:'Дева',d:27,m:26},h12:{s:'Весы',d:22,m:38},lilith:{s:'Дева',d:3,m:44},chiron:{s:'Телец',d:13,m:54}}},
    {name:'Мария (Ростов-на-Дону) — 13.08.1986 22:24 UTC+4',yr:1986,mo:8,dy:13,h:22,mi:24,sc:0,lat:47.23,lon:39.70,utc:4,
     expected:{
       sun:{s:'Лев',d:20,m:42},moon:{s:'Скорпион',d:29,m:28},mercury:{s:'Лев',d:2,m:0},
       venus:{s:'Весы',d:6,m:12},mars:{s:'Козерог',d:11,m:25},jupiter:{s:'Рыбы',d:21,m:14},
       saturn:{s:'Стрелец',d:3,m:5},uranus:{s:'Стрелец',d:18,m:26},neptune:{s:'Козерог',d:3,m:18},
       pluto:{s:'Скорпион',d:4,m:46},node:{s:'Овен',d:23,m:55},chiron:{s:'Близнецы',d:20,m:7},
       asc:{s:'Овен',d:15,m:24},mc:{s:'Козерог',d:6,m:58},
       h2:{s:'Телец',d:24,m:25},h3:{s:'Близнецы',d:17,m:42},
       h8:{s:'Скорпион',d:24,m:25},h9:{s:'Стрелец',d:17,m:42},
       h11:{s:'Козерог',d:27,m:29},h12:{s:'Водолей',d:25,m:44},
     }},
  ];

  // SP CALIBRATION — Astrodienst D6251GW, 28.03.2026
  // Sign codes: a=Ari b=Tau c=Gem d=Can e=Leo f=Vir g=Lib h=Sco i=Sag j=Cap k=Aqu l=Pis
  const SP_TESTS=[
    {name:'Александр — Прогрессии на 28.03.2026',yr:1979,mo:8,dy:12,h:13,mi:29,sc:30,lat:46.85,lon:29.63,utc:3,
     targetYr:2026,targetMo:3,targetDy:28,
     // Prog JD: 2444144.563134 (46.63 days after birth)
     expected:{sun:{s:'Весы',d:4,m:20},moon:{s:'Стрелец',d:20,m:28},mercury:{s:'Весы',d:15,m:46},venus:{s:'Весы',d:13,m:23},mars:{s:'Лев',d:1,m:53},saturn:{s:'Дева',d:19,m:25},pluto:{s:'Весы',d:18,m:32},asc:{s:'Стрелец',d:17,m:35},mc:{s:'Весы',d:14,m:23}}},
    {name:'Мария — Прогрессии на 28.03.2026',yr:1986,mo:8,dy:13,h:22,mi:24,sc:0,lat:47.23,lon:39.70,utc:4,
     targetYr:2026,targetMo:3,targetDy:28,
     // Prog JD: 2446695.888230 (39.62 days after birth)
     expected:{sun:{s:'Дева',d:29,m:4},moon:{s:'Телец',d:17,m:57},mercury:{s:'Весы',d:12,m:14},venus:{s:'Скорпион',d:11,m:37},saturn:{s:'Стрелец',d:4,m:44},asc:{s:'Близнецы',d:14,m:38},mc:{s:'Водолей',d:14,m:10}}},
  ];

  const[results,setResults]=useState(null);
  const[spResults,setSPResults]=useState(null);

  const runSP=()=>{
    const res=SP_TESTS.map(t=>{
      try{
        const natal=AE.calcChart(t.yr,t.mo,t.dy,t.h,t.mi,t.sc,t.lat,t.lon,t.utc);
        const targetJD=AE.jd(t.targetYr,t.targetMo,t.targetDy,12,0,0);
        const ageYears=(targetJD-natal.JD)/365.25;
        const progJD=natal.JD+ageYears;
        const prog=AE.planetsAtJD(progJD,t.lat,t.lon);
        const checks=[];
        const signN={Овен:0,Телец:30,Близнецы:60,Рак:90,Лев:120,Дева:150,Весы:180,Скорпион:210,Стрелец:240,Козерог:270,Водолей:300,Рыбы:330};
        for(const[k,exp]of Object.entries(t.expected)){
          const expLon=signN[exp.s]+exp.d+exp.m/60;
          let actual;
          if(k==='asc')actual=prog.houses[0];
          else if(k==='mc')actual=prog.houses[9];
          else actual=prog.planets[k]?.lon;
          if(actual===undefined){checks.push({k,exp:lonStr(expLon),got:'N/A',totalMin:999,ok:false,qual:'poor'});continue}
          let diff=Math.abs(actual-expLon);if(diff>180)diff=360-diff;
          const totalMin=Math.round(diff*60);
          const ok=totalMin<=15;
          const qual=totalMin<=3?'exact':totalMin<=15?'good':totalMin<=60?'approx':'poor';
          checks.push({k,exp:lonStr(expLon),got:lonStr(actual),totalMin,ok,qual});
        }
        const pass=checks.every(c=>c.ok||c.qual==='approx');
        return{name:t.name,checks,pass,progJD:progJD.toFixed(3),ageYears:ageYears.toFixed(2)};
      }catch(e){return{name:t.name,error:e.message,pass:false}}
    });
    setSPResults(res);
  };

  const run=()=>{
    const res=TESTS.map(t=>{
      try{
        const ch=AE.calcChart(t.yr,t.mo,t.dy,t.h,t.mi,t.sc,t.lat,t.lon,t.utc);
        const checks=[];
        const houseIdx={h2:1,h3:2,h5:4,h6:5,h8:7,h9:8,h11:10,h12:11};
        // Tolerances in arcminutes per planet (Meeus low-precision inherent limits)
        const TOL={sun:3,moon:3,mercury:15,venus:15,mars:15,jupiter:20,
          saturn:60,uranus:90,neptune:45,pluto:150,
          node:10,lilith:15,chiron:15,
          asc:3,mc:3,h2:15,h3:15,h5:15,h6:15,h8:15,h9:15,h11:15,h12:15};
        for(const[k,exp]of Object.entries(t.expected)){
          let actual;
          if(k==='asc')actual=ch.asc;
          else if(k==='mc')actual=ch.mc;
          else if(houseIdx[k]!==undefined)actual=ch.houses[houseIdx[k]];
          else actual=ch.planets[k]?.lon;
          if(actual===undefined){checks.push({k,ok:false,msg:'нет данных'});continue}
          const ai=Math.floor(actual/30),ad=Math.floor(actual%30),am=Math.floor((actual%1)*60);
          const signName=SIGNS[ai].n;
          // Real arcminute error: |actual_total_minutes - expected_total_minutes|
          const dErr=0,mErr=Math.abs(ad*60+am-(exp.d*60+exp.m));
          const totalMin=mErr;
          const tol=TOL[k]||30;
          const ok=signName===exp.s&&totalMin<=tol;
          const qual=totalMin===0?'точно':totalMin<=10?'отлично':totalMin<=30?'хорошо':totalMin<=60?'приемл.':'грубо';
          checks.push({k,ok,got:`${signName} ${ad}°${String(am).padStart(2,'0')}'`,exp:`${exp.s} ${exp.d}°${String(exp.m).padStart(2,'0')}'`,dErr,mErr,totalMin,qual});
        }
        return{name:t.name,checks,pass:checks.every(c=>c.ok)};
      }catch(e){return{name:t.name,error:e.message,pass:false}}
    });
    setResults(res);
  };

  return(
    <div>
      <div className="card" style={{marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div>
            <div style={{fontWeight:500,color:'var(--gold)',marginBottom:2}}>Калибровка движка</div>
            <div style={{fontSize:11,color:'var(--tx2)'}}>Сравнение с эталонными данными Astrodienst (Swiss Ephemeris). База: 81 365 натальных карт.</div>
          </div>
          <button className="bp" onClick={run}>Запустить тесты натальной</button>
          <button className="bs" onClick={runSP} style={{marginLeft:8}}>Тест прогрессий (Astrodienst)</button>
        </div>
        <div style={{fontSize:11,color:'var(--tx3)'}}>
          Алгоритмы: Меус Ch.25 (☉), Ch.47 60-терм (☽), Ch.33 гелио+геоцентр. проекция (♀♂♃...), Ch.37+геоцентр.корр. (♇), Плацидус. Точность: ☉~0.01°, ☽~0.1′, личные планеты ~0.1–0.2°, внешние ~0.3–0.5°, ♇~0.25° (ограничение упрощённой формулы Меуса).
        </div>
      </div>
      {results&&results.map((r,ri)=>(
        <div key={ri} className="card" style={{marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
            <span style={{fontSize:16,color:r.pass?'var(--green)':'var(--red)'}}>{r.pass?'✓':'✗'}</span>
            <strong style={{color:'var(--tx1)'}}>{r.name}</strong>
            {r.error&&<span style={{color:'var(--red)',fontSize:11}}>{r.error}</span>}
          </div>
          {r.checks&&(
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead><tr style={{borderBottom:'1px solid var(--border2)'}}>
                <th style={{padding:'4px 7px',textAlign:'left',color:'var(--tx2)',fontWeight:500}}>Точка</th>
                <th style={{padding:'4px 7px',textAlign:'left',color:'var(--tx2)',fontWeight:500}}>Эталон (Astrodienst)</th>
                <th style={{padding:'4px 7px',textAlign:'left',color:'var(--tx2)',fontWeight:500}}>Движок</th>
                <th style={{padding:'4px 7px',textAlign:'center',color:'var(--tx2)',fontWeight:500}}>Δ总'</th>
                <th style={{padding:'4px 7px',textAlign:'left',color:'var(--tx2)',fontWeight:500}}>Точность</th>
                <th style={{padding:'4px 7px',textAlign:'center',color:'var(--tx2)',fontWeight:500}}>Точность</th>
                <th style={{padding:'4px 7px',textAlign:'center',color:'var(--tx2)',fontWeight:500}}>Статус</th>
              </tr></thead>
              <tbody>{r.checks.map((c,ci)=>{
                const qualCol={exact:'var(--green)',good:'var(--green)',approx:'var(--orange)',poor:'var(--red)'}[c.qual||'poor'];
                const qualLbl={exact:'точно',good:'хорошо',approx:'приемл.',poor:'грубо'}[c.qual||'poor'];
                return(
                <tr key={ci} style={{borderBottom:'1px solid var(--border)',background:c.ok?'':'rgba(204,85,85,0.03)'}}>
                  <td style={{padding:'4px 7px',color:'var(--tx2)',fontWeight:500}}>{(PM[c.k]?.n)||c.k.toUpperCase()}</td>
                  <td style={{padding:'4px 7px',color:'var(--tx1)'}}>{c.exp}</td>
                  <td style={{padding:'4px 7px',color:c.ok?'var(--green)':c.qual==='approx'?'var(--orange)':'var(--red)'}}>{c.got}</td>
                  <td style={{padding:'4px 7px',textAlign:'center',color:c.totalMin<=15?'var(--green)':c.totalMin<=60?'var(--orange)':'var(--red)',fontWeight:500}}>{c.totalMin}'</td>
                  <td style={{padding:'4px 7px'}}><span style={{fontSize:11,color:qualCol,background:qualCol+'15',padding:'1px 6px',borderRadius:8}}>{qualLbl}</span></td>
                  <td style={{padding:'4px 7px',textAlign:'center',fontSize:14,color:c.ok?'var(--green)':'var(--red)'}}>{c.ok?'✓':'✗'}</td>
                </tr>);
              })}</tbody>
            </table>
          )}
        </div>
      ))}
    </div>
  );
}

function printTable(headers, rows){
  const hdrs=headers.map(h=>`<th>${h}</th>`).join('');
  const rws=rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
  return`<table><thead><tr>${hdrs}</tr></thead><tbody>${rws}</tbody></table>`;
}

function PrintBtn({getHTML, title, meta=''}){
  const print=()=>{
    const w=window.open('','_blank','width=900,height=700');
    w.document.write(buildPrintHTML(title,getHTML(),meta));
    w.document.close();
    w.focus();
    setTimeout(()=>w.print(),600);
  };
  return(<button className="bs" onClick={print} style={{padding:'5px 12px',fontSize:11,borderColor:'rgba(200,168,75,0.3)',color:'var(--gold)'}}>⎙ PDF</button>);
}

function chartPrintHTML(chart, label=''){

  const signOf=lon=>SIGNS[Math.floor(lon/30)];

  const pHdr=['Планета','Позиция','Стихия','Дом','Функция'];
  const pRows=Object.entries(chart.planets).map(([k,p])=>{const m=PM[k];const s=signOf(p.lon);return[m?`${m.s} ${m.n}`:k,fmtLon(p.lon),elBadge(s.el),p.house,m?.f?.split('—').slice(1).join('—').trim()||'']});
  html+=printTable(pHdr,pRows)+'</div>';

  const hRows=chart.houses.map((lon,i)=>[`${i+1}${hLbl[i]?` ${hLbl[i]}`:''}`,fmtLon(lon),HM[i]?.k||'']);
  html+=printTable(['Дом','Куспид','Тема'],hRows)+'</div>';
  // Aspects
  const byT={hard:[],neutral:[],soft:[],tension:[],minor:[]};
  chart.aspects.forEach(a=>byT[a.def.type]?.push(a));
  const aRows=[...byT.hard,...byT.neutral,...byT.soft,...byT.tension,...byT.minor].map(a=>{
    const m1=PM[a.p1],m2=PM[a.p2];
    const tc={soft:'soft',hard:'hard',neutral:'neutral',tension:'tension'}[a.def.type]||'';
    return [`<span class="${tc}">${a.def.sym} ${a.def.name}</span>`,
      `${m1?.s||''}${m1?.n||a.p1} — ${m2?.s||''}${m2?.n||a.p2}`,`${a.orb}°`];
  });
  html+=`<div class="section"><div class="section-title">Аспекты (${chart.aspects.length})</div>`;
  html+=printTable(['Аспект','Планеты','Орб.'],aRows)+'</div>';
  return html;
}

// ══════════════════════════════════════════════════════════
// LOCAL SPACE TAB — azimuth/altitude chart (Astrodienst D22ALS)
// Calibrated: Alexander/Maria from Krasnodar vs Astrodienst PDF
// Az convention: South=0°, West=90°, North=180°, East=270°
// ══════════════════════════════════════════════════════════
// Direction labels in Astrodienst LS convention (S=0°)
const LS_DIRS=['S','SSW','SW','WSW','W','WNW','NW','NNW','N','NNE','NE','ENE','E','ESE','SE','SSE'];

function azToDir(az){return LS_DIRS[Math.round(az/22.5)%16]}

function LocalSpaceTab(){
  const[natal,setNatal]=useState(null);
  const[ls,setLS]=useState(null);
  const[city,setCity]=useState('');
  const[refLat,setRefLat]=useState('');
  const[refLon,setRefLon]=useState('');
  const[geoStatus,setGeoStatus]=useState('');
  const[view,setView]=useState('table');
  const canvasRef=useRef(null);

  const handleNatal=ch=>{
    setNatal(ch);setLS(null);
    setRefLat((ch._lat||'').toString());setRefLon((ch._lon||'').toString());
  };

  const findCity=async()=>{
    if(!city.trim())return;setGeoStatus('Поиск...');
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`);
      const d=await r.json();
      if(d&&d[0]){setRefLat((+d[0].lat).toFixed(4));setRefLon((+d[0].lon).toFixed(4));setGeoStatus('✓ '+d[0].display_name.split(',').slice(0,2).join(', '))}
      else setGeoStatus('Не найдено');
    }catch{setGeoStatus('Ошибка сети')}
  };

  const calc=()=>{
    if(!natal||!refLat||!refLon)return;
    try{setLS(AE.localSpaceCalc(natal,+refLat,+refLon))}catch(e){alert('Ошибка: '+e.message)}
  };

  // Draw local space wheel on canvas
  useEffect(()=>{
    const cv=canvasRef.current;if(!cv||!ls)return;
    const W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=Math.min(W,H)/2-10;
    const ctx=cv.getContext('2d');
    ctx.clearRect(0,0,W,H);

    // Background
    const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
    grad.addColorStop(0,'#0d0e1c');grad.addColorStop(1,'#07080f');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(cx,cy,R,0,6.28);ctx.fill();

    // Horizon rings
    for(const [r,a]of[[R,'rgba(80,100,180,0.3)'],[R*0.66,'rgba(80,100,180,0.15)'],[R*0.33,'rgba(80,100,180,0.1)']]) {
      ctx.beginPath();ctx.arc(cx,cy,r,0,6.28);ctx.strokeStyle=a;ctx.lineWidth=0.7;ctx.stroke();
    }
    // Labels: altitude circles
    ctx.fillStyle='rgba(80,100,180,0.5)';ctx.font='9px sans-serif';
    ctx.fillText('0°',cx+R+2,cy+3);
    ctx.fillText('30°',cx+R*0.66+2,cy+3);
    ctx.fillText('60°',cx+R*0.33+2,cy+3);

    // Direction lines + labels
    // Convention: S=top (az=0° at top), going counterclockwise (W right, E left)
    // In canvas: top=S=0°, rotating counterclockwise → az=90°W is to the right
    // Actually: S at top, rotating CW makes W to left (astronomical convention from below)
    // Astrodienst wheel: S=top, E=left, N=bottom, W=right (viewed from above)
    const azToCanvas=(az,r)=>{
      // az=0° South → top (angle=-90° in canvas)
      // az=90° West → right (+0° from right)
      // az=180° North → bottom (+90° from right)
      // az=270° East → left (+180° from right)
      const a=(-90+az)*Math.PI/180;
      return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};
    };

    const cardinals=[['S',0],['SW',45],['W',90],['NW',135],['N',180],['NE',225],['E',270],['SE',315]];
    for(const[lbl,az]of cardinals){
      const p1=azToCanvas(az,R*0.92),p2=azToCanvas(az,R);
      const pl=azToCanvas(az,R+10);
      ctx.strokeStyle=['S','W','N','E'].includes(lbl)?'rgba(200,168,75,0.6)':'rgba(80,100,180,0.35)';
      ctx.lineWidth=['S','W','N','E'].includes(lbl)?1.5:0.7;
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
      ctx.fillStyle=['S','W','N','E'].includes(lbl)?'var(--gold)':'rgba(80,100,180,0.6)';
      ctx.font=['S','W','N','E'].includes(lbl)?'bold 10px sans-serif':'9px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(lbl,pl.x,pl.y);
    }

    // Horizon line (alt=0)
    ctx.beginPath();ctx.arc(cx,cy,R,0,6.28);
    ctx.strokeStyle='rgba(100,200,100,0.25)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.stroke();
    ctx.setLineDash([]);

    // Planets
    for(const[pk,p]of Object.entries(ls)){
      const m=PM[pk];if(!m)continue;
      // Altitude maps to radius: alt=0° → edge (R), alt=90° → center
      const altFrac=Math.max(0,1-(p.alt+90)/180); // rough, better: (90-alt)/90
      const r=p.above ? R*(1-p.alt/90) : R; // above: closer to center, below: at edge
      const pos=azToCanvas(p.az,p.above?Math.max(8,r):R+2);
      const col=ACG_COLORS[pk]||m.c;

      if(!p.above){
        // Below horizon: draw at edge with reduced opacity
        ctx.globalAlpha=0.35;
      }
      ctx.beginPath();ctx.arc(pos.x,pos.y,9,0,6.28);
      ctx.fillStyle=col+'22';ctx.fill();
      ctx.strokeStyle=p.above?col:col+'66';ctx.lineWidth=0.8;ctx.stroke();
      ctx.fillStyle=p.above?col:col+'88';
      ctx.font='11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(m.s,pos.x,pos.y);
      ctx.globalAlpha=1;
    }

    // Horizon fill (below = darker)
    ctx.beginPath();ctx.arc(cx,cy,R,0,6.28);
    ctx.fillStyle='rgba(10,20,50,0.0)';ctx.fill();

    // MC/IC markers
    const mcp=azToCanvas(0,R-12),icp=azToCanvas(180,R-12);
    ctx.fillStyle='rgba(200,168,75,0.7)';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('MC',mcp.x,mcp.y);ctx.fillText('IC',icp.x,icp.y);
  },[ls]);

  const getPrintHTML=()=>{
    if(!ls)return'';
    const fmtDeg=d=>`${d>0?'+':''}${d.toFixed(1)}°`;
    const rows=Object.entries(ls).map(([pk,p])=>{
      const m=PM[pk];
      const azDeg=p.az; const ad=Math.floor(azDeg),am=Math.floor((azDeg%1)*60),as=Math.floor(((azDeg%1)*60%1)*60);
      const altDeg=p.alt; const sign=altDeg>=0?'':'-'; const aa=Math.abs(Math.floor(altDeg)),am2=Math.floor((Math.abs(altDeg)%1)*60);
      return[m?`${m.s} ${m.n}`:pk,
        `${ad}°${String(am).padStart(2,'0')}'${String(as).padStart(2,'0')}"`,
        `${sign}${aa}°${String(am2).padStart(2,'0')}'`,
        azToDir(p.az),
        p.above?'↑ над горизонтом':'↓ под горизонтом'];
    });
    return`<div class="section"><div class="section-title">Local Space — Позиции планет</div>`+
      printTable(['Планета','Азимут (S=0°)','Высота','Направление','Положение'],rows)+
      '</div>';
  };

  const fmtAz=v=>{const d=Math.floor(v),m=Math.floor((v%1)*60),s=Math.floor(((v%1)*60%1)*60);return`${d}°${String(m).padStart(2,'0')}'${String(s).padStart(2,'0')}"`;};
  const fmtAlt=v=>{const neg=v<0,a=Math.abs(v),d=Math.floor(a),m=Math.floor((a%1)*60);return`${neg?'- ':''}${d}°${String(m).padStart(2,'0')}'`;};

  return(
    <div>
      <BirthForm onCalc={handleNatal} title="Натальная карта"/>
      {natal&&(
        <div className="card" style={{marginBottom:12}}>
          <div style={{fontWeight:500,color:'var(--gold)',marginBottom:8,fontSize:12}}>Место наблюдения (референсная точка)</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:6,marginBottom:6}}>
            <input value={city} onChange={e=>setCity(e.target.value)} onKeyDown={e=>e.key==='Enter'&&findCity()} placeholder="Краснодар, Стамбул, Белград..."/>
            <button className="bs" onClick={findCity}>Найти</button>
          </div>
          {geoStatus&&<div style={{fontSize:11,color:geoStatus.startsWith('✓')?'var(--green)':'var(--tx2)',marginBottom:6}}>{geoStatus}</div>}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:7,alignItems:'flex-end'}}>
            <div><label>Широта</label><input value={refLat} onChange={e=>setRefLat(e.target.value)} placeholder="45.03"/></div>
            <div><label>Долгота</label><input value={refLon} onChange={e=>setRefLon(e.target.value)} placeholder="38.97"/></div>
            <button className="bp" onClick={calc} style={{padding:'7px 20px'}}>Рассчитать</button>
          </div>
        </div>
      )}

      {ls&&(
        <>
          <div style={{display:'flex',gap:6,marginBottom:12,alignItems:'center',flexWrap:'wrap'}}>
            {['table','wheel'].map(v=>(
              <button key={v} className={view===v?'bp':'bs'} style={{padding:'5px 14px',fontSize:12}} onClick={()=>setView(v)}>
                {v==='table'?'Таблица':'Колесо Local Space'}
              </button>
            ))}
            <div style={{marginLeft:'auto'}}>
              <PrintBtn getHTML={getPrintHTML} title={`Local Space — ${natal?.meta?.name||''}`}
                meta={`Нат. место: ${natal._lat?.toFixed(2)}°N ${natal._lon?.toFixed(2)}°E | Реф: ${(+refLat).toFixed(2)}°N ${(+refLon).toFixed(2)}°E`}/>
            </div>
          </div>

          {view==='table'&&(
            <div className="card" style={{overflowX:'auto'}}>
              <div style={{fontSize:11,color:'var(--tx3)',marginBottom:8}}>
                Азимут: Юг=0°, Запад=90°, Север=180°, Восток=270° (конвенция Astrodienst D22ALS)
              </div>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                <thead><tr style={{borderBottom:'1px solid var(--border2)'}}>
                  <th style={{padding:'5px 8px',textAlign:'left',color:'var(--tx2)'}}>Планета</th>
                  <th style={{padding:'5px 8px',textAlign:'left',color:'var(--tx2)'}}>Долгота</th>
                  <th style={{padding:'5px 8px',textAlign:'right',color:'var(--tx2)'}}>Азимут</th>
                  <th style={{padding:'5px 8px',textAlign:'right',color:'var(--tx2)'}}>Высота</th>
                  <th style={{padding:'5px 8px',textAlign:'center',color:'var(--tx2)'}}>Направление</th>
                  <th style={{padding:'5px 8px',textAlign:'center',color:'var(--tx2)'}}>Горизонт</th>
                </tr></thead>
                <tbody>{Object.entries(ls).map(([pk,p])=>{
                  const m=PM[pk];if(!m)return null;
                  return(<tr key={pk} style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:'5px 8px',color:m.c,fontWeight:500}}>{m.s} {m.n}</td>
                    <td style={{padding:'5px 8px'}}>{lonStr(p.lon)}</td>
                    <td style={{padding:'5px 8px',textAlign:'right',fontFamily:'monospace'}}>{fmtAz(p.az)}</td>
                    <td style={{padding:'5px 8px',textAlign:'right',fontFamily:'monospace',color:p.above?'var(--green)':'var(--tx3)'}}>{fmtAlt(p.alt)}</td>
                    <td style={{padding:'5px 8px',textAlign:'center',color:'var(--gold)',fontSize:11,fontWeight:500}}>{azToDir(p.az)}</td>
                    <td style={{padding:'5px 8px',textAlign:'center',fontSize:12}}>{p.above?<span style={{color:'var(--green)'}}>↑</span>:<span style={{color:'var(--tx3)'}}>↓</span>}</td>
                  </tr>);
                })}</tbody>
              </table>
            </div>
          )}

          {view==='wheel'&&(
            <div className="card" style={{display:'flex',justifyContent:'center',flexDirection:'column',alignItems:'center',gap:10}}>
              <div style={{fontSize:11,color:'var(--tx2)',textAlign:'center'}}>
                Local Space колесо — Юг (MC) сверху, Запад справа, Восток слева<br/>
                <span style={{color:'var(--tx3)'}}>Планеты над горизонтом: ближе к центру. Ниже горизонта: у края (полупрозрачно).</span>
              </div>
              <canvas ref={canvasRef} width={460} height={460} style={{width:'100%',maxWidth:460,height:'auto',borderRadius:8}}/>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// DUAL WHEEL — natal + overlay (progressions, transits, etc.)
// ══════════════════════════════════════════════════════════
function DualWheel({natal,overlay,size=480,labelNatal='Нат.',labelOverlay=''}){
  if(!natal)return null;
  const cx=size/2,cy=size/2,R=size/2;
  const zodR=R-10,zodIn=zodR-30,houseIn=zodIn-26,aspR=houseIn-20;
  const natR=aspR-12,ovR=aspR-26;
  const aLon=natal.asc;
  const toA=lon=>{const rel=AE.n360(lon-aLon);return(180-rel)*Math.PI/180};
  const ptA=(lon,r)=>{const a=toA(lon);return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}};
  return(
    <svg width={size} height={size} style={{display:'block',maxWidth:'100%',margin:'0 auto'}}>
      <defs><radialGradient id="rg2" cx="50%" cy="50%" r="50%"><stop offset="0%" stopColor="#1a1c36"/><stop offset="100%" stopColor="#0a0b1a"/></radialGradient></defs>
      <circle cx={cx} cy={cy} r={R-2} fill="url(#rg2)" stroke="rgba(80,100,180,0.25)" strokeWidth="1"/>
      {[zodR,zodIn,houseIn,aspR,natR,ovR].map((r,i)=><circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke="rgba(80,100,180,0.2)" strokeWidth="0.5"/>)}
      {SIGNS.map((s,i)=>{
        const p1=ptA(i*30,zodR),p2=ptA(i*30+30,zodR),p3=ptA(i*30+30,zodIn),p4=ptA(i*30,zodIn);
        const lp=ptA(i*30+15,zodIn+14); const c=ELC[s.el];
        return(<g key={i}><path d={`M${p1.x},${p1.y} A${zodR},${zodR} 0 0,0 ${p2.x},${p2.y} L${p3.x},${p3.y} A${zodIn},${zodIn} 0 0,1 ${p4.x},${p4.y} Z`} fill={c+'15'} stroke={c+'35'} strokeWidth="0.5"/>
        <text x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="middle" fontSize="9" fill={c+'cc'}>{s.s}</text></g>);
      })}
      {natal.houses.map((lon,i)=>{
        const isA=[0,3,6,9].includes(i);
        const p1=ptA(lon,zodIn),p2=ptA(lon,ovR-4),pl=ptA(lon,houseIn+12);
        return(<g key={i}><line x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke={isA?'rgba(200,168,75,0.55)':'rgba(80,100,180,0.22)'} strokeWidth={isA?1.2:0.7} strokeDasharray={isA?'none':'3,3'}/>
        <text x={pl.x} y={pl.y} textAnchor="middle" dominantBaseline="middle" fontSize="7.5" fill={isA?'rgba(200,168,75,0.75)':'rgba(120,130,180,0.55)'}>{i+1}</text></g>);
      })}
      {/* Natal planets — inner ring */}
      {Object.entries(natal.planets).map(([k,p])=>{
        const m=PM[k];if(!m)return null;
        const pos=ptA(p.lon,natR);
        return(<g key={k}><circle cx={pos.x} cy={pos.y} r="9" fill={m.c+'1a'} stroke={m.c+'44'} strokeWidth="0.7"/>
        <text x={pos.x} y={pos.y} textAnchor="middle" dominantBaseline="middle" fontSize="10" fill={m.c}>{m.s}</text></g>);
      })}
      {/* Overlay planets — outer ring */}
      {overlay&&Object.entries(overlay.planets).map(([k,p])=>{
        const m=PM[k];if(!m)return null;
        const pos=ptA(p.lon,ovR);
        return(<g key={'o'+k}><circle cx={pos.x} cy={pos.y} r="8" fill={m.c+'12'} stroke={m.c+'66'} strokeWidth="1.2" strokeDasharray="3,2"/>
        <text x={pos.x} y={pos.y} textAnchor="middle" dominantBaseline="middle" fontSize="9.5" fill={m.c+'cc'}>{m.s}</text></g>);
      })}
      {[{lon:natal.asc,lbl:'ASC'},{lon:natal.mc,lbl:'MC'}].map(({lon,lbl})=>{
        const p=ptA(lon,zodR+12);
        return<text key={lbl} x={p.x} y={p.y} textAnchor="middle" dominantBaseline="middle" fontSize="8" fill="rgba(200,168,75,0.85)" fontWeight="600">{lbl}</text>;
      })}
      <text x={cx} y={cy-8} textAnchor="middle" dominantBaseline="middle" fontSize="10" fill="rgba(100,140,210,0.5)">{labelNatal}</text>
      {labelOverlay&&<text x={cx} y={cy+8} textAnchor="middle" dominantBaseline="middle" fontSize="10" fill="rgba(200,168,75,0.45)">{labelOverlay}</text>}
    </svg>
  );
}

// ══════════════════════════════════════════════════════════
// PROGRESSIONS TAB — Secondary Progressions + Solar Arc
// ══════════════════════════════════════════════════════════
function calcSecondaryProgressions(natal, targetJD){
  // Secondary progressions: 1 day after birth = 1 year of life
  // prog_JD = birth_JD + (targetJD - birth_JD) / 365.25
  const ageYears = (targetJD - natal.JD) / 365.25;
  const progJD = natal.JD + ageYears;  // 1 day = 1 year
  const lat = natal._lat, lon = natal._lon;
  const raw = {
    sun:AE._calcRaw('sun',progJD), moon:AE._calcRaw('moon',progJD),
    mercury:AE._calcRaw('mercury',progJD), venus:AE._calcRaw('venus',progJD),
    mars:AE._calcRaw('mars',progJD), jupiter:AE._calcRaw('jupiter',progJD),
    saturn:AE._calcRaw('saturn',progJD), uranus:AE._calcRaw('uranus',progJD),
    neptune:AE._calcRaw('neptune',progJD), pluto:AE._calcRaw('pluto',progJD),
    node:AE._calcRaw('node',progJD), lilith:AE._calcRaw('lilith',progJD), chiron:AE._calcRaw('chiron',progJD),
  };
  const houses = (lat&&lon) ? AE._placidus(progJD,lat,lon) : natal.houses;
  const planets = {};
  for(const[k,v]of Object.entries(raw)) planets[k]={...v, house:AE.getHouse(v.lon,houses)};
  return {planets, houses, aspects:AE.calcAspects(planets), JD:progJD, asc:houses[0], mc:houses[9],
          _lat:lat, _lon:lon, ageYears};
}

function calcSolarArc(natal, targetJD){
  // Solar arc = progressed Sun - natal Sun
  const ageYears = (targetJD - natal.JD) / 365.25;
  const progJD = natal.JD + ageYears;
  const progSun = AE._calcRaw('sun', progJD);
  const sa = AE.n360(progSun.lon - natal.planets.sun.lon);
  const planets = {};
  for(const[k,p]of Object.entries(natal.planets)){
    const dirLon = AE.n360(p.lon + sa);
    planets[k] = {...p, lon:dirLon, house:AE.getHouse(dirLon, natal.houses)};
  }
  const houses = natal.houses.map(h=>AE.n360(h+sa));
  return {planets, houses, aspects:AE.calcAspects(planets), JD:targetJD,
          asc:AE.n360(natal.asc+sa), mc:AE.n360(natal.mc+sa), solarArc:sa};
}

function ProgressionsTab(){
  const[natal,setNatal]=useState(null);
  const[spChart,setSP]=useState(null);
  const[saChart,setSA]=useState(null);
  const[mode,setMode]=useState('sp');  // sp | sa | both
  const[view,setView]=useState('wheel');
  const[tgt,setTgt]=useState(()=>{const n=new Date();return{year:n.getFullYear()+'',month:(n.getMonth()+1)+'',day:n.getDate()+''}});

  const handleNatal=ch=>{setNatal(ch);setSP(null);setSA(null)};
  const calc=()=>{
    if(!natal)return;
    const n=new Date();
    const yr=+(tgt.year||n.getFullYear()), mo=+(tgt.month||n.getMonth()+1), dy=+(tgt.day||n.getDate());
    const targetJD = AE.jd(yr,mo,dy,12,0,0);
    if(mode==='sp'||mode==='both') setSP(calcSecondaryProgressions(natal,targetJD));
    if(mode==='sa'||mode==='both') setSA(calcSolarArc(natal,targetJD));
  };

  const overlay = mode==='sa' ? saChart : spChart;
  const overlayLabel = mode==='sa' ? `SA ${saChart?.solarArc?.toFixed(1)}°` : `SP +${overlay?.ageYears?.toFixed(1)}y`;

  return(
    <div>
      <BirthForm onCalc={handleNatal} title="Натальная карта (основа)"/>
      {natal&&(
        <div className="card" style={{marginBottom:12}}>
          <div style={{fontWeight:500,color:'var(--gold)',marginBottom:10,fontSize:12}}>Целевая дата прогрессий</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr auto auto',gap:7,alignItems:'flex-end'}}>
            <div><label>Год</label><input value={tgt.year} onChange={e=>setTgt(p=>({...p,year:e.target.value}))} placeholder="2026"/></div>
            <div><label>Месяц</label><input value={tgt.month} onChange={e=>setTgt(p=>({...p,month:e.target.value}))} placeholder="3"/></div>
            <div><label>День</label><input value={tgt.day} onChange={e=>setTgt(p=>({...p,day:e.target.value}))} placeholder="28"/></div>
            <div><label>Метод</label>
              <select value={mode} onChange={e=>setMode(e.target.value)}>
                <option value="sp">Вторичные прогрессии</option>
                <option value="sa">Солнечные дуги (SA)</option>
                <option value="both">Оба метода</option>

// RETURNS TAB — Solar & Lunar Returns
// ══════════════════════════════════════════════════════════
function findSolarReturn(natal, targetYear, lat, lon){
  // Find JD when Sun returns to natal Sun longitude in given year
  const nSun = natal.planets.sun.lon;
  // Estimate JD around the target birthday
  let JD = AE.jd(targetYear, natal._mo||6, natal._dy||21, 12, 0, 0);
  // Newton iteration
  for(let i=0;i<50;i++){
    const s = AE._calcRaw('sun', JD);
    let diff = nSun - s.lon;
    if(diff>180) diff-=360;
    if(diff<-180) diff+=360;
    if(Math.abs(diff)<0.0001) break;
    JD += diff/0.9856;  // ~0.9856°/day for Sun
  }
  // Full chart at return moment
  const raw={sun:AE._calcRaw('sun',JD),moon:AE._calcRaw('moon',JD),
    mercury:AE._calcRaw('mercury',JD),venus:AE._calcRaw('venus',JD),mars:AE._calcRaw('mars',JD),
    jupiter:AE._calcRaw('jupiter',JD),saturn:AE._calcRaw('saturn',JD),
    uranus:AE._calcRaw('uranus',JD),neptune:AE._calcRaw('neptune',JD),
    pluto:AE._calcRaw('pluto',JD),node:AE._calcRaw('node',JD),
    lilith:AE._calcRaw('lilith',JD),chiron:AE._calcRaw('chiron',JD)};
  const houses=AE._placidus(JD,lat,lon);
  const planets={};
  for(const[k,v]of Object.entries(raw)) planets[k]={...v,house:AE.getHouse(v.lon,houses)};
  return{planets,houses,aspects:AE.calcAspects(planets),JD,asc:houses[0],mc:houses[9],_lat:lat,_lon:lon,type:'solar'};
}

function findLunarReturn(natal, afterJD, lat, lon){
  // Find next JD after afterJD when Moon returns to natal Moon longitude
  const nMoon = natal.planets.moon.lon;
  let JD = afterJD;
  for(let i=0;i<50;i++){
    const m = AE._calcRaw('moon', JD);
    let diff = nMoon - m.lon;
    if(diff>180) diff-=360;
    if(diff<-180) diff+=360;
    if(Math.abs(diff)<0.001) break;
    JD += diff/13.176; // Moon moves ~13.176°/day
  }
  const raw={sun:AE._calcRaw('sun',JD),moon:AE._calcRaw('moon',JD),
    mercury:AE._calcRaw('mercury',JD),venus:AE._calcRaw('venus',JD),mars:AE._calcRaw('mars',JD),
    jupiter:AE._calcRaw('jupiter',JD),saturn:AE._calcRaw('saturn',JD),
    uranus:AE._calcRaw('uranus',JD),neptune:AE._calcRaw('neptune',JD),
    pluto:AE._calcRaw('pluto',JD),node:AE._calcRaw('node',JD),
    lilith:AE._calcRaw('lilith',JD),chiron:AE._calcRaw('chiron',JD)};
  const houses=AE._placidus(JD,lat,lon);
  const planets={};
  for(const[k,v]of Object.entries(raw)) planets[k]={...v,house:AE.getHouse(v.lon,houses)};
  return{planets,houses,aspects:AE.calcAspects(planets),JD,asc:houses[0],mc:houses[9],_lat:lat,_lon:lon,type:'lunar'};
}

function jdToDate(jd){
  // Convert JD to calendar date string
  const j=jd+0.5;const Z=Math.floor(j);const F=j-Z;
  let A=Z;if(Z>=2299161){const a=Math.floor((Z-1867216.25)/36524.25);A=Z+1+a-Math.floor(a/4)}
  const B=A+1524;const C=Math.floor((B-122.1)/365.25);const D=Math.floor(365.25*C);
  const E=Math.floor((B-D)/30.6001);
  const day=B-D-Math.floor(30.6001*E);
  const mo=E<14?E-1:E-13;const yr=mo>2?C-4716:C-4715;
  const h=F*24;const hh=Math.floor(h),mm=Math.floor((h-hh)*60);
  return`${String(day).padStart(2,'0')}.${String(mo).padStart(2,'0')}.${yr} ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

// COMPOSITE TAB — Midpoint Chart
// ══════════════════════════════════════════════════════════
function calcComposite(c1,c2){
  if(!c1||!c2)return null;
  function midLon(a,b){
    let d=AE.n360(b-a);
    if(d>180)d-=360;
    return AE.n360(a+d/2);
  }
  const planets={};
  for(const k of Object.keys(c1.planets)){
    if(!c2.planets[k])continue;
    const lon=midLon(c1.planets[k].lon,c2.planets[k].lon);
    planets[k]={lon};
  }
  // Composite ASC = midpoint of ASC angles
  const asc=midLon(c1.asc,c2.asc);
  const mc=midLon(c1.mc,c2.mc);
  const houses=[asc,0,0,AE.n360(asc+180-60),0,0,AE.n360(asc+180),0,0,mc,0,0];
  for(const k of Object.keys(planets)) planets[k].house=AE.getHouse(planets[k].lon,houses);
  return{planets,houses,aspects:AE.calcAspects(planets),JD:(c1.JD+c2.JD)/2,asc,mc};
}

function CompositeTab(){
  const[c1,setC1]=useState(null);
  const[c2,setC2]=useState(null);
  const[comp,setComp]=useState(null);
  const[view,setView]=useState('wheel');

  useEffect(()=>{if(c1&&c2)setComp(calcComposite(c1,c2))},[c1,c2]);

  return(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:0}}>
        <BirthForm onCalc={setC1} title="Партнёр 1"/>

        <>

            {['wheel','table','aspects'].map(v=>(
              <button key={v} className={view===v?'bp':'bs'} style={{padding:'5px 14px',fontSize:12}} onClick={()=>setView(v)}>
                {v==='wheel'?'Колесо':v==='table'?'Планеты':'Аспекты'}

            ))}

      )}
    </div>
  );
}

// ACG calculation
function acgGMST(JD){const t=(JD-2451545)/36525;const r=d=>{const x=d%360;return x<0?x+360:x};return r(280.46061837+360.98564736629*(JD-2451545)+3.87933e-4*t*t-t*t*t/38710000)}
function acgObl(JD){const t=(JD-2451545)/36525;return 23.4392911-1.3004167e-2*t-1.639e-7*t*t+5.036e-7*t*t*t}
function eclToRA(lon,eps){const e=lon*Math.PI/180,ep=eps*Math.PI/180;return(Math.atan2(Math.sin(e)*Math.cos(ep),Math.cos(e))*180/Math.PI+360)%360}

function buildACGLines(chart){
  const GMST=acgGMST(chart.JD),eps=acgObl(chart.JD);
  const R=Math.PI/180,D=180/Math.PI,n360=d=>{const r=d%360;return r<0?r+360:r};
  const e=eps*R,result={};
  for(const[pk,planet]of Object.entries(chart.planets)){
    const plon=planet.lon;
    const RA=eclToRA(plon,eps);
    let mc_lon=n360(RA-GMST); if(mc_lon>180)mc_lon-=360;
    let ic_lon=mc_lon+180; if(ic_lon>180)ic_lon-=360;
    const asc_pts=[],dsc_pts=[];
    for(let lat=-78;lat<=78;lat+=1.5){
      const phi=lat*R;
      let RAMC=n360(RA+15);
      for(let it=0;it<60;it++){
        const ra_r=RAMC*R;
        const asc=n360(D*Math.atan2(Math.cos(ra_r),-(Math.sin(e)*Math.tan(phi)+Math.cos(e)*Math.sin(ra_r))));
        let diff=plon-asc; if(diff>180)diff-=360; if(diff<-180)diff+=360;
        if(Math.abs(diff)<5e-5)break;
        RAMC=n360(RAMC+diff*0.5);
      }
      let g=RAMC-GMST; g=((g%360)+360)%360; if(g>180)g-=360;
      asc_pts.push([g,lat]);
      let d=g+180; if(d>180)d-=360; dsc_pts.push([d,lat]);
    }
    result[pk]={mc:mc_lon,ic:ic_lon,asc:asc_pts,dsc:dsc_pts};
  }
  return result;
}

function findNearbyLines(lat,lon,acgLines,thr=12){
  const acts=[];
  for(const[pk,ln]of Object.entries(acgLines)){
    // MC/IC — vertical lines, distance = lon diff * cos(lat)
    const cosL=Math.cos(lat*Math.PI/180);
    for(const[type,ref]of[['MC',ln.mc],['IC',ln.ic]]){
      let d=Math.abs(lon-ref); if(d>180)d=360-d;
      const deg=d*cosL;
      if(deg<thr) acts.push({planet:pk,line:type,distance:+deg.toFixed(2)});
    }
    // ASC/DSC — find closest point on curved line
    for(const[type,pts]of[['ASC',ln.asc],['DSC',ln.dsc]]){
      let min=Infinity;
      for(const[pl,plat]of pts){
        // Wrap-aware distance
        let dl=Math.abs(lon-pl); if(dl>180)d=360-dl; else dl=dl;
        const dp=Math.abs(lat-plat);
        const dist=Math.sqrt((dl*cosL)**2+dp**2);
        if(dist<min)min=dist;
      }
      if(min<thr) acts.push({planet:pk,line:type,distance:+min.toFixed(2)});
    }
  }
  return acts.sort((a,b)=>a.distance-b.distance);
}

function locScore(activations){
  let s=0;
  for(const a of activations){
    const w=Math.max(0,12-a.distance)/12;
    const ps={sun:8,moon:7,venus:10,jupiter:10,mars:5,mercury:7,saturn:4,uranus:4,neptune:5,pluto:5}[a.planet]||5;
    const ls={MC:1.0,ASC:1.0,DSC:0.75,IC:0.6}[a.line]||0.5;
    s+=ps*ls*w*10;
  }
  return Math.min(100,Math.round(s));
}

// Best years: when progressed Sun/MC aligns with location lines
function calcBestYears(natal, targetLon, targetLat){
  const GMST0=acgGMST(natal.JD), eps=acgObl(natal.JD);
  const results=[];
  const currentYear=new Date().getFullYear();
  for(let yr=currentYear-2;yr<=currentYear+10;yr++){
    const age=yr-natal._birthYear;
    if(age<0)continue;
    const progJD=natal.JD+age; // 1 day = 1 year
    // Progressed Sun position
    const t=(progJD-2451545)/36525;
    const L0=(280.46646+36000.76983*t+3.032e-4*t*t)%360;
    const M=(357.52911+35999.05029*t-1.537e-4*t*t)%360,Mr=M*Math.PI/180;
    const C=(1.914602-4.817e-3*t-1.4e-5*t*t)*Math.sin(Mr)+(1.9993e-2-1.01e-4*t)*Math.sin(2*Mr);
    const om=(125.04-1934.136*t)%360;
    const pSun=(L0+C-5.69e-3-4.78e-3*Math.sin(om*Math.PI/180)+360)%360;
    // MC line of progressed Sun at target longitude
    const pRA=eclToRA(pSun,eps);
    const GMST_yr=acgGMST(natal.JD+(yr-natal._birthYear)*365.25);
    let pMC=pRA-GMST_yr; pMC=((pMC%360)+360)%360; if(pMC>180)pMC-=360;
    const cosL=Math.cos(targetLat*Math.PI/180);
    let diff=Math.abs(targetLon-pMC); if(diff>180)diff=360-diff;
    if(diff*cosL<15) results.push({year:yr,age,planet:'Прогр. ☉',line:'MC',distance:+(diff*cosL).toFixed(1)});
  }
  return results;
}

function LocalTab(){
  const [natal,setNatal]=useState(null);
  const [acgLines,setACGLines]=useState(null);
  const [selectedLoc,setSelectedLoc]=useState(null);
  const [cityInput,setCityInput]=useState('');
  const [geoStatus,setGeoStatus]=useState('');
  const [compareCities,setCompareCities]=useState([]);
  const [visPlanets,setVisPlanets]=useState({sun:true,moon:true,mercury:true,venus:true,mars:true,jupiter:true,saturn:true,uranus:false,neptune:false,pluto:false});
  const [visLines,setVisLines]=useState({asc:true,mc:true,dsc:false,ic:false});
  const [highlightPlanet,setHighlightPlanet]=useState(null);
  const canvasRef=useRef(null);
  const W=820,H=410;

  const handleNatal=ch=>{setNatal(ch);setACGLines(buildACGLines(ch));setSelectedLoc(null);setCompareCities([])};

  const ll2xy=useCallback((lon,lat)=>({x:(lon+180)/360*W,y:(90-lat)/180*H}),[]);
  const xy2ll=useCallback((x,y)=>({lon:x/W*360-180,lat:90-y/H*180}),[]);

  useEffect(()=>{
    const cv=canvasRef.current; if(!cv)return;
    const ctx=cv.getContext('2d');
    ctx.clearRect(0,0,W,H);

    // Ocean
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#080d1e'); grad.addColorStop(1,'#0c1530');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

    // Grid
    ctx.lineWidth=0.5;
    for(let lon=-180;lon<=180;lon+=30){
      const x=(lon+180)/360*W;
      ctx.strokeStyle=lon===0?'rgba(80,100,180,0.3)':'rgba(80,100,180,0.12)';
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
      if(lon>-180){ctx.fillStyle='rgba(80,100,180,0.3)';ctx.font='9px sans-serif';ctx.fillText(lon+'°',x+2,H-3);}
    }
    for(let lat=-60;lat<=90;lat+=30){
      const y=(90-lat)/180*H;
      ctx.strokeStyle=lat===0?'rgba(80,150,80,0.3)':'rgba(80,100,180,0.12)';
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
      ctx.fillStyle='rgba(80,100,180,0.3)';ctx.font='9px sans-serif';
      if(lat!==0)ctx.fillText(lat+'°',2,y-2);
    }
    // Tropic lines
    ctx.strokeStyle='rgba(100,150,80,0.2)';ctx.lineWidth=0.7;ctx.setLineDash([4,4]);
    [23.5,-23.5,66.5,-66.5].forEach(lat=>{const y=(90-lat)/180*H;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()});
    ctx.setLineDash([]);

    // Continents
    ctx.fillStyle='#1a2245';
    ctx.strokeStyle='rgba(60,80,160,0.45)';ctx.lineWidth=0.8;
    for(const poly of WORLD_POLYS){
      ctx.beginPath();let first=true;
      for(const[lon,lat]of poly){const{x,y}=ll2xy(lon,lat);first?(ctx.moveTo(x,y),first=false):ctx.lineTo(x,y)}
      ctx.closePath();ctx.fill();ctx.stroke();
    }

    // ACG lines
    if(acgLines){
      const lineTypes=[
        ['asc',visLines.asc,[],[],1.8],
        ['mc',visLines.mc,[4,4],[],1.8],
        ['dsc',visLines.dsc,[2,3],[],1.2],
        ['ic',visLines.ic,[6,2],[],1.2],
      ];
      for(const[pk,ln]of Object.entries(acgLines)){
        if(!visPlanets[pk])continue;
        const col=ACG_COLORS[pk]||'#888';
        const isHL=!highlightPlanet||highlightPlanet===pk;
        const alpha=isHL?'':'44';

        // MC (vertical)
        if(visLines.mc){
          const x=(ln.mc+180)/360*W;
          ctx.strokeStyle=col+(isHL?'cc':'33');ctx.lineWidth=isHL?2:1;ctx.setLineDash([4,4]);
          ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
          if(isHL){ctx.fillStyle=col+'bb';ctx.font='bold 10px sans-serif';ctx.fillText((PM[pk]?.s||pk)+'MC',x+2,14);}
        }
        // IC (vertical)
        if(visLines.ic){
          const x=(ln.ic+180)/360*W;
          ctx.strokeStyle=col+(isHL?'66':'22');ctx.lineWidth=1;ctx.setLineDash([6,3]);
          ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
        }
        // ASC (curved)
        if(visLines.asc&&ln.asc){
          ctx.strokeStyle=col+(isHL?'dd':'44');ctx.lineWidth=isHL?1.8:1;ctx.setLineDash([]);
          drawCurvedLine(ctx,ln.asc,ll2xy,W);
          if(isHL){
            const mid=ln.asc[Math.floor(ln.asc.length*0.35)];
            if(mid){const{x,y}=ll2xy(mid[0],mid[1]);ctx.fillStyle=col+'bb';ctx.font='bold 10px sans-serif';ctx.fillText((PM[pk]?.s||pk)+'↑',x+2,y-2);}
          }
        }
        // DSC (curved)
        if(visLines.dsc&&ln.dsc){
          ctx.strokeStyle=col+(isHL?'88':'22');ctx.lineWidth=1;ctx.setLineDash([2,4]);
          drawCurvedLine(ctx,ln.dsc,ll2xy,W);
        }
      }
      ctx.setLineDash([]);
    }

    // Compare city markers
    for(const c of compareCities){
      const{x,y}=ll2xy(c.lon,c.lat);
      ctx.fillStyle='#5bbbcc88';ctx.strokeStyle='#3399aacc';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(x,y,5,0,6.28);ctx.fill();ctx.stroke();
      ctx.fillStyle='#5bbbcc';ctx.font='bold 10px sans-serif';ctx.fillText(c.shortName||c.name.split(',')[0],x+7,y+3);
    }

    // Selected location marker
    if(selectedLoc){
      const{x,y}=ll2xy(selectedLoc.lon,selectedLoc.lat);
      ctx.fillStyle='#fff';ctx.strokeStyle='#c8a84b';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(x,y,6,0,6.28);ctx.fill();ctx.stroke();
      ctx.fillStyle='#c8a84b';ctx.font='bold 11px sans-serif';
      ctx.fillText(selectedLoc.shortName||'●',x+9,y+4);
    }
  },[acgLines,visPlanets,visLines,selectedLoc,compareCities,highlightPlanet,ll2xy]);

  function drawCurvedLine(ctx,pts,ll2xy,W){
    ctx.beginPath();let first=true,lastX=null;
    for(const[lon,lat]of pts){
      const{x,y}=ll2xy(lon,lat);
      if(first){ctx.moveTo(x,y);first=false;lastX=x;}
      else{if(Math.abs(x-lastX)>W/2)ctx.moveTo(x,y);else ctx.lineTo(x,y);lastX=x;}
    }ctx.stroke();
  }

  const handleCanvasClick=e=>{
    if(!acgLines)return;
    const cv=canvasRef.current; if(!cv)return;
    const rect=cv.getBoundingClientRect();
    const sx=W/rect.width,sy=H/rect.height;
    const{lon,lat}=xy2ll((e.clientX-rect.left)*sx,(e.clientY-rect.top)*sy);
    const activations=findNearbyLines(lat,lon,acgLines);
    setSelectedLoc({lat,lon,name:`${Math.abs(lat).toFixed(1)}°${lat>=0?'N':'S'} ${Math.abs(lon).toFixed(1)}°${lon>=0?'E':'W'}`,shortName:'⊙',activations,score:locScore(activations)});
    setGeoStatus('');
  };

  const findCity=async()=>{
    if(!cityInput.trim())return;setGeoStatus('Поиск...');
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cityInput)}&format=json&limit=1`);
      const d=await r.json();
      if(d&&d[0]){
        const lat=+d[0].lat,lon=+d[0].lon;
        const name=d[0].display_name.split(',').slice(0,2).join(', ');
        const activations=acgLines?findNearbyLines(lat,lon,acgLines):[];
        setSelectedLoc({lat,lon,name,shortName:d[0].display_name.split(',')[0],activations,score:locScore(activations)});
        setGeoStatus('✓ '+name);
      }else setGeoStatus('Не найдено');
    }catch{setGeoStatus('Ошибка сети')}
  };

  const addCompare=()=>{
    if(!selectedLoc||compareCities.some(c=>c.lat===selectedLoc.lat&&c.lon===selectedLoc.lon))return;
    setCompareCities(p=>[...p,selectedLoc]);
  };

  const scoreColor=s=>s>=70?'var(--green)':s>=40?'var(--gold)':s>=20?'var(--orange)':'var(--tx3)';

  return(
    <div>
      <BirthForm onCalc={handleNatal} title="Натальная карта для астрокартографии"/>
      {natal&&(
        <>
          {/* Controls */}
          <div className="card" style={{marginBottom:10}}>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',marginBottom:7}}>
              <span style={{fontSize:11,color:'var(--tx2)'}}>Планеты:</span>
              {Object.keys(ACG_COLORS).map(pk=>(
                <button key={pk} onClick={()=>setVisPlanets(p=>({...p,[pk]:!p[pk]}))}
                  onMouseEnter={()=>setHighlightPlanet(pk)} onMouseLeave={()=>setHighlightPlanet(null)}
                  style={{padding:'3px 8px',fontSize:11,borderRadius:4,cursor:'pointer',transition:'all .15s',
                    background:visPlanets[pk]?ACG_COLORS[pk]+'22':'transparent',
                    color:visPlanets[pk]?ACG_COLORS[pk]:'var(--tx3)',
                    border:`1px solid ${visPlanets[pk]?ACG_COLORS[pk]+'66':'var(--border)'}`,
                    fontWeight:highlightPlanet===pk?700:400}}>
                  {PM[pk]?.s} {PM[pk]?.n}
                </button>
              ))}
            </div>
            <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
              <span style={{fontSize:11,color:'var(--tx2)'}}>Линии:</span>
              {[['asc','ASC ↑'],['mc','MC ―― '],['dsc','DSC ↓'],['ic','IC ···']].map(([k,l])=>(
                <button key={k} onClick={()=>setVisLines(p=>({...p,[k]:!p[k]}))}
                  style={{padding:'3px 9px',fontSize:11,borderRadius:4,cursor:'pointer',
                    background:visLines[k]?'rgba(200,168,75,0.15)':'transparent',
                    color:visLines[k]?'var(--gold)':'var(--tx3)',
                    border:`1px solid ${visLines[k]?'rgba(200,168,75,0.35)':'var(--border)'}`}}>
                  {l}
                </button>
              ))}
              <span style={{fontSize:10,color:'var(--tx3)',marginLeft:8}}>Наведи на планету — подсветка линий</span>
            </div>
          </div>

          {/* World map */}
          <div className="card" style={{padding:6,marginBottom:10}}>
            <canvas ref={canvasRef} width={W} height={H}
              style={{width:'100%',height:'auto',cursor:acgLines?'crosshair':'default',display:'block',borderRadius:6}}
              onClick={handleCanvasClick}/>
            <div style={{fontSize:10,color:'var(--tx3)',marginTop:4,textAlign:'center'}}>
              Клик на карте — анализ точки | Наведи на кнопку планеты — подсветка её линий
            </div>
          </div>

          {/* City search */}
          <div className="card" style={{marginBottom:10}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr auto auto',gap:7,alignItems:'flex-end'}}>
              <div>
                <label>Город для анализа</label>
                <input value={cityInput} onChange={e=>setCityInput(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&findCity()}
                  placeholder="Стамбул, Белград, Монтенегро, Мюнхен, Барселона..."/>
              </div>
              <button className="bp" onClick={findCity} style={{padding:'7px 18px'}}>Анализ</button>
              {selectedLoc&&<button className="bs" onClick={addCompare} style={{padding:'7px 12px',fontSize:12}}>+ В сравнение</button>}
            </div>
            {geoStatus&&<div style={{fontSize:11,marginTop:5,color:geoStatus.startsWith('✓')?'var(--green)':'var(--tx2)'}}>{geoStatus}</div>}
          </div>

          {/* Location analysis */}
          {selectedLoc&&(
            <div className="card" style={{marginBottom:10}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14}}>
                <div>
                  <div style={{color:'var(--gold)',fontWeight:600,fontSize:15,marginBottom:2}}>{selectedLoc.name}</div>
                  <div style={{fontSize:11,color:'var(--tx3)'}}>{selectedLoc.lat.toFixed(3)}°N / {selectedLoc.lon.toFixed(3)}°E</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:11,color:'var(--tx2)',marginBottom:2}}>Потенциал</div>
                  <div style={{fontSize:28,fontWeight:800,color:scoreColor(selectedLoc.score||0),lineHeight:1}}>{selectedLoc.score||0}</div>
                  <div style={{fontSize:10,color:'var(--tx3)'}}>из 100</div>
                </div>
              </div>

              {(!selectedLoc.activations||selectedLoc.activations.length===0)&&(
                <div style={{textAlign:'center',color:'var(--tx3)',padding:'16px',fontSize:12}}>
                  Нет активных линий вблизи этой точки (в радиусе 12°).<br/>
                  <span style={{fontSize:11}}>Нейтральная локация — никакая планета не акцентирована.</span>
                </div>
              )}

              {selectedLoc.activations&&selectedLoc.activations.length>0&&(
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  {selectedLoc.activations.slice(0,8).map((act,i)=>{
                    const m=PM[act.planet];if(!m)return null;
                    const meaning=(ACG_MEANING[act.planet]||{})[act.line]||'';
                    const st=act.distance<3?{l:'Точная',c:'var(--gold)'}:act.distance<6?{l:'Сильная',c:'var(--green)'}:act.distance<9?{l:'Умеренная',c:'var(--orange)'}:{l:'Слабая',c:'var(--tx3)'};
                    return(
                      <div key={i} style={{background:'rgba(80,100,180,0.07)',borderRadius:8,padding:'10px 14px',borderLeft:`3px solid ${ACG_COLORS[act.planet]}`}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
                          <div style={{fontWeight:600,fontSize:13}}>
                            <span style={{color:ACG_COLORS[act.planet],fontSize:17,marginRight:5}}>{m.s}</span>
                            <span style={{color:ACG_COLORS[act.planet]}}>{m.n}</span>
                            <span style={{color:'var(--tx2)',marginLeft:6,fontWeight:400}}>на {act.line}</span>
                          </div>
                          <div style={{display:'flex',gap:8,alignItems:'center'}}>
                            <span style={{fontSize:11,color:'var(--tx3)'}}>Δ {act.distance}°</span>
                            <span style={{fontSize:11,background:st.c+'20',color:st.c,padding:'2px 8px',borderRadius:10,fontWeight:500}}>{st.l}</span>
                          </div>
                        </div>
                        <div style={{fontSize:12,color:'var(--tx2)',lineHeight:1.5}}>{meaning}</div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Best years to move */}
              {natal._birthYear&&selectedLoc.activations&&selectedLoc.activations.length>0&&(()=>{
                const timing=calcBestYears(natal,selectedLoc.lon,selectedLoc.lat);
                if(timing.length===0)return null;
                return(
                  <div style={{marginTop:14,background:'rgba(200,168,75,0.07)',borderRadius:8,padding:'10px 14px'}}>
                    <div style={{color:'var(--gold)',fontWeight:500,fontSize:12,marginBottom:8}}>⟳ Когда активируется эта локация</div>
                    <div style={{fontSize:12,color:'var(--tx2)',marginBottom:6}}>Прогрессированное Солнце проходит через МС этой локации:</div>
                    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                      {timing.map((t,i)=>(
                        <span key={i} style={{background:'rgba(200,168,75,0.15)',color:'var(--gold)',padding:'4px 12px',borderRadius:8,fontSize:12,fontWeight:600}}>
                          {t.year} (возраст {t.age}) — Δ{t.distance}°
                        </span>
                      ))}
                    </div>
                  </div>
                );
              })()}
            </div>
          )}

          {/* Comparison table */}
          {compareCities.length>0&&(
            <div className="card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>

                <button className="bs" style={{fontSize:11,padding:'3px 10px'}} onClick={()=>setCompareCities([])}>Очистить</button>

                    <th style={{padding:'5px 8px',textAlign:'center',color:'var(--tx2)'}}>Балл</th>
                    <th style={{padding:'5px 8px',textAlign:'left',color:'var(--tx2)'}}>Активные линии</th>
                    <th style={{padding:'5px 8px',textAlign:'left',color:'var(--tx2)'}}>Топ интерпретация</th>
                    <th style={{padding:'5px 8px',textAlign:'right',color:'var(--tx2)'}}>Коорд.</th>

                    const top=(city.activations||[]).slice(0,4);
                    const bestMeaning=top.length>0?(ACG_MEANING[top[0].planet]||{})[top[0].line]||'':'-';

                      <td style={{padding:'5px 8px'}}>
